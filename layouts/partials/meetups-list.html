{{- $embed := site.Params.meetups.embed_src -}}
{{- if $embed -}}
<div class="meetups-embed">
  <iframe
    src="{{ $embed }}"
    title="Meetup calendar"
    loading="lazy"
    frameborder="0"
    scrolling="no"
  ></iframe>
</div>
{{- else -}}
<p class="meetups-empty">Meetup calendar embed is not configured. Set <code>params.meetups.embed_src</code> in <code>config.toml</code> (Google Calendar embed URL).</p>
{{- end -}}
