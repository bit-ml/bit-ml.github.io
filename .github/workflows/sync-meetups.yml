name: Sync meetup calendar

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: bit-ml-website
          environment-file: environment.yml
          auto-update-conda: true
          python-version: "3.12"

      - name: Sync ICS to data/meetups.yaml
        env:
          MEETUP_CALENDAR_ICS_URL: ${{ secrets.MEETUP_CALENDAR_ICS_URL }}
        run: python scripts/sync-meetup-calendar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meetups.yaml
          if git diff --staged --quiet; then
            echo "No meetup data changes."
            exit 0
          fi
          git commit -m "chore: sync meetup calendar from ICS"
          git push
